[project]
name = "d2s"
version = "0.1.0"
description = "D2S Bharat backend cores: decision engine, ML services, workers"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "numpy>=2.0",
    "pandas>=2.2",
    "ortools>=9.14",
]

[project.optional-dependencies]
ml = [
    "statsforecast>=2.0",
    "sentence-transformers>=5.1",
]
workers = [
    "arq>=0.27",
    "redis>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/d2s"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["slow: downloads models or runs long solves"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py312"
