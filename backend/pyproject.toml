[project]
name = "d2s"
version = "0.1.0"
description = "D2S Bharat backend cores: decision engine, ML services, workers"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "numpy>=2.0",
    "pandas>=2.2",
    "ortools>=9.14",
]

[project.optional-dependencies]
ml = [
    "statsforecast>=2.0",
    "sentence-transformers>=5.1",
]
workers = [
    "arq>=0.27",
    "redis>=5.0",
]
api = [
    "fastapi>=0.115",
    "pwdlib[argon2]>=0.2",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]
db = [
    "chromadb>=1.0",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
]
agents = [
    "langchain-core>=0.3",
    "langchain-ollama>=0.3",
    "langgraph>=0.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]
viz = [
    "matplotlib>=3.9",
    "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/d2s"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["slow: downloads models or runs long solves"]
addopts = "-m 'not slow'"
filterwarnings = [
    # OR-Tools' SWIG bindings on Python 3.13; harmless
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
    # ETS candidate on very short test series; that model is just scored worse, not used
    "ignore:divide by zero encountered in scalar divide:RuntimeWarning:statsforecast",
]

[tool.ruff]
line-length = 100
target-version = "py312"
